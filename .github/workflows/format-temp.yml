name: Format Temp Issue 51

on:
  push:
    branches:
      - feat/51-ai-writing

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: "3.13"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: uv sync --all-packages
      - run: pnpm install --frozen-lockfile
      - name: Format changed files
        shell: bash
        run: |
          base=$(git merge-base HEAD origin/main)
          mapfile -t pyfiles < <(git diff --name-only --diff-filter=ACMR "$base"...HEAD | grep -E '\.py$' || true)
          if (( ${#pyfiles[@]} )); then
            uv run ruff format "${pyfiles[@]}"
          fi
          mapfile -t webfiles < <(git diff --name-only --diff-filter=ACMR "$base"...HEAD | grep -E '\.(js|jsx|ts|tsx|json|jsonc)$' || true)
          if (( ${#webfiles[@]} )); then
            pnpm biome format --write "${webfiles[@]}"
          fi
          git restore uv.lock || true
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format issue 51 changes"
          git push
