name: Format final MVP (temporary)

on:
  push:
    branches:
      - feat/mvp-guidelines-figma-redesign

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/mvp-guidelines-figma-redesign
      - uses: astral-sh/setup-uv@v4
        with:
          version: latest
          python-version: "3.13"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: uv sync --all-packages
      - run: pnpm install --frozen-lockfile
      - name: Format changed files
        shell: bash
        run: |
          base=$(git merge-base HEAD origin/main)
          mapfile -t pyfiles < <(git diff --name-only --diff-filter=ACMR "$base"...HEAD | grep -E '\.py$' || true)
          mapfile -t webfiles < <(git diff --name-only --diff-filter=ACMR "$base"...HEAD | grep -E '\.(js|jsx|mjs|cjs|ts|tsx|mts|cts|json|jsonc)$' || true)
          if (( ${#pyfiles[@]} )); then uv run ruff format "${pyfiles[@]}"; fi
          if (( ${#webfiles[@]} )); then pnpm biome check --write "${webfiles[@]}"; fi
          if git diff --quiet; then echo "No formatting changes needed."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format final MVP changes"
          git push origin HEAD:feat/mvp-guidelines-figma-redesign
