name: Issue 64 UI Patch

on:
  push:
    branches:
      - feat/64-context-actions-dnd-print

permissions:
  contents: write

jobs:
  patch:
    if: "${{ !startsWith(github.event.head_commit.message, 'feat(mail): wire context actions') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pnpm install --frozen-lockfile
      - name: Apply patch
        run: |
          python3 .ci/patch_issue64_mail.py
          python3 - <<'PY'
          from pathlib import Path

          mail = Path('apps/web/src/app/app/mail/page.tsx')
          text = mail.read_text()
          text = text.replace('join("\n• ")', 'join("\\n• ")')
          text = text.replace('names.join("\n")', 'names.join("\\n")')
          text = text.replace('`Move to folder:\n${', '`Move to folder:\\n${')
          text = text.replace('].join("\n"),', '].join("\\n"),')
          text = text.replace('/app/mail/print?', '/print/mail?')
          text = text.replace('if (aiAction && aiAction.startsWith("ai_reply"))', 'if (aiAction?.startsWith("ai_reply"))')
          text = text.replace(' className="aiResultBackdrop" role="presentation" onClick={() => setAiResult(null)}', ' className="aiResultBackdrop" role="presentation"')
          text = text.replace(' aria-label={aiResult.title} onClick={(event) => event.stopPropagation()}', ' aria-label={aiResult.title}')
          text = text.replace('<section className="aiResultDialog" role="dialog" aria-modal="true" aria-label={aiResult.title}>', '<dialog open className="aiResultDialog" aria-label={aiResult.title}>')
          text = text.replace('</section>\n        </div>', '</dialog>\n        </div>')
          mail.write_text(text)

          print_page = Path('apps/web/src/app/print/mail/page.tsx')
          text = print_page.read_text()
          text = text.replace(
              '    let cancelled = false;\n    async function load() {',
              '    const accountId = account;\n    const folderName = folder;\n    let cancelled = false;\n    async function load() {',
          )
          text = text.replace('api.messageDetail(account!, folder!, uid)', 'api.messageDetail(accountId, folderName, uid)')
          text = text.replace('api.threadDetail(account!, message.thread_id)', 'api.threadDetail(accountId, message.thread_id)')
          print_page.write_text(text)
          PY
      - name: Format web files
        run: pnpm biome check --write apps/web/src/app/app/mail/page.tsx apps/web/src/components/mail-context-menu.tsx apps/web/src/lib/mail-actions.ts apps/web/src/app/print/mail/page.tsx
      - name: Clean helpers and commit
        shell: bash
        run: |
          rm -f .ci/patch_issue64_mail.py .github/workflows/issue64-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(mail): wire context actions into unified inbox'
          git push
