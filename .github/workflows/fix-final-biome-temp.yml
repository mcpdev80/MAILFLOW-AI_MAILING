name: Fix final MVP Biome diagnostics (temporary)

on:
  push:
    branches:
      - feat/mvp-guidelines-figma-redesign

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mvp-guidelines-figma-redesign
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pnpm install --frozen-lockfile
      - name: Apply intentional fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "apps/web/src/app/app/review/use-review-page.ts",
              '''    (item: OperationalReviewItem) => {\n      if (item.source_type !== "backfill_failure" || !item.job_id) {\n        return Promise.resolve();\n      }\n      return runBusy(item.id, () =>\n        attentionApi.retryBackfillFailure(\n          item.account_id,\n          item.job_id!,\n          item.id,\n        ),\n      );\n    },''',
              '''    (item: OperationalReviewItem) => {\n      const jobId = item.job_id;\n      if (item.source_type !== "backfill_failure" || !jobId) {\n        return Promise.resolve();\n      }\n      return runBusy(item.id, () =>\n        attentionApi.retryBackfillFailure(item.account_id, jobId, item.id),\n      );\n    },''',
          )

          replace(
              "apps/web/src/app/app/dashboard/dashboard-ui.tsx",
              '''      >\n        <polyline\n          className={styles.trendLine}''',
              '''      >\n        <title>{props.t("dashboard.trend")}</title>\n        <polyline\n          className={styles.trendLine}''',
          )

          replace(
              "apps/web/src/app/app/dashboard/page.tsx",
              '''function DashboardContent({ state }: { state: DashboardState }) {\n  const overview = state.overview!;\n  return (''',
              '''function DashboardContent({ state }: { state: DashboardState }) {\n  if (!state.overview) return null;\n  return (''',
          )
          replace(
              "apps/web/src/app/app/dashboard/page.tsx",
              '''function DashboardGrid({ state }: { state: DashboardState }) {\n  const { t } = useI18n();\n  const overview = state.overview!;\n  return (''',
              '''function DashboardGrid({ state }: { state: DashboardState }) {\n  const { t } = useI18n();\n  const overview = state.overview;\n  if (!overview) return null;\n  return (''',
          )

          replace(
              "apps/web/src/app/app/mail/mail-workspace-overlays.tsx",
              '''function ContextMenuOverlay({ state }: { state: WorkspaceState }) {\n  const menu = state.contextMenu!;\n  return (''',
              '''function ContextMenuOverlay({ state }: { state: WorkspaceState }) {\n  const menu = state.contextMenu;\n  if (!menu) return null;\n  return (''',
          )
          replace(
              "apps/web/src/app/app/mail/mail-workspace-overlays.tsx",
              '''function AiDialog({ state }: { state: WorkspaceState }) {\n  const { t } = useI18n();\n  const result = state.aiResult!;\n  return (''',
              '''function AiDialog({ state }: { state: WorkspaceState }) {\n  const { t } = useI18n();\n  const result = state.aiResult;\n  if (!result) return null;\n  return (''',
          )

          replace(
              "apps/web/src/app/app/mail/mail-workspace-content.tsx",
              '''function MoveControls({ state }: { state: WorkspaceState }) {\n  const { t } = useI18n();\n  const selected = state.selected!;\n  return (''',
              '''function MoveControls({ state }: { state: WorkspaceState }) {\n  const { t } = useI18n();\n  const selected = state.selected;\n  if (!selected) return null;\n  return (''',
          )
          replace(
              "apps/web/src/app/app/mail/mail-workspace-content.tsx",
              '''function MoreButton({ state }: { state: WorkspaceState }) {\n  const { t } = useI18n();\n  return (''',
              '''function MoreButton({ state }: { state: WorkspaceState }) {\n  const { t } = useI18n();\n  const selected = state.selected;\n  if (!selected) return null;\n  return (''',
          )
          replace(
              "apps/web/src/app/app/mail/mail-workspace-content.tsx",
              '''        void state.openContextMenuAt(state.selected!, {''',
              '''        void state.openContextMenuAt(selected, {''',
          )

          replace(
              "apps/web/src/app/app/attachments/attachments-ui.tsx",
              '''      {state.savedDecision && (\n        <div className={styles.toast} role="status">\n          {t("attachments.decisionSaved")}\n        </div>\n      )}''',
              '''      {state.savedDecision && (\n        <output className={styles.toast}>\n          {t("attachments.decisionSaved")}\n        </output>\n      )}''',
          )

          replace(
              "apps/web/src/app/app/compose/compose-ui.tsx",
              '''    <label\n      style={{''',
              '''    <div\n      style={{''',
          )
          replace(
              "apps/web/src/app/app/compose/compose-ui.tsx",
              '''    </label>\n  );\n}\n\nfunction AiBar''',
              '''    </div>\n  );\n}\n\nfunction AiBar''',
          )
          replace(
              "apps/web/src/app/app/compose/compose-ui.tsx",
              '''      <EditorMode\n        value={controller.fields.editorMode}''',
              '''      <EditorModeToggle\n        value={controller.fields.editorMode}''',
          )
          replace(
              "apps/web/src/app/app/compose/compose-ui.tsx",
              '''function EditorMode({''',
              '''function EditorModeToggle({''',
          )

          replace(
              "apps/web/src/app/app/mail/use-mail-message-view.ts",
              '''  useEffect(() => {\n    setSelected(null);\n    setThread(null);\n  }, [options.selectedAccountId]);''',
              '''  // biome-ignore lint/correctness/useExhaustiveDependencies: changing mailboxes must clear the selected message.\n  useEffect(() => {\n    setSelected(null);\n    setThread(null);\n  }, [options.selectedAccountId]);''',
          )

          replace(
              "apps/web/src/app/app/learning/page.tsx",
              '''      <section\n        className={page.modal}\n        role="dialog"\n        aria-modal="true"\n        aria-labelledby="create-memory-title"\n      >''',
              '''      <dialog\n        open\n        className={page.modal}\n        aria-labelledby="create-memory-title"\n      >''',
          )
          replace(
              "apps/web/src/app/app/learning/page.tsx",
              '''      </section>\n    </div>\n  );\n}\n\nfunction toWrite''',
              '''      </dialog>\n    </div>\n  );\n}\n\nfunction toWrite''',
          )
          PY

          pnpm biome check \
            apps/web/src/app/app/review/use-review-page.ts \
            apps/web/src/app/app/dashboard/dashboard-ui.tsx \
            apps/web/src/app/app/dashboard/page.tsx \
            apps/web/src/app/app/compose/compose-ui.tsx \
            apps/web/src/app/app/mail/mail-workspace-overlays.tsx \
            apps/web/src/app/app/mail/mail-workspace-content.tsx \
            apps/web/src/app/app/mail/use-mail-message-view.ts \
            apps/web/src/app/app/attachments/attachments-ui.tsx \
            apps/web/src/app/app/learning/page.tsx

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(web): resolve final MVP lint diagnostics"
          git push origin HEAD:feat/mvp-guidelines-figma-redesign
