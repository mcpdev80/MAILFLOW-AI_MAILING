name: Onboarding Path Validation

on:
  push:
    branches:
      - feat/mvp-guidelines-figma-redesign
    paths:
      - .github/workflows/validate-onboarding-e2e.yml
      - apps/web/src/app/accept-invitation/**
      - apps/web/src/middleware.ts
      - apps/web/src/lib/locales/*-members.ts
      - apps/web/e2e/onboarding-flow.spec.mjs
      - apps/api/app/auth.py
      - apps/api/app/routers/llm_providers.py
      - apps/api/tests/unit/test_org_admin_auth.py

jobs:
  api-rbac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: latest
          python-version: "3.13"
      - run: uv sync --all-packages
      - name: Lint RBAC changes
        run: >-
          uv run ruff check
          apps/api/app/auth.py
          apps/api/app/routers/llm_providers.py
          apps/api/tests/unit/test_org_admin_auth.py
      - name: Run organization admin role tests
        working-directory: apps/api
        env:
          SECRET_KEY: qdCa5nGhLjd8qY0CCaQP2dE000lbSYDmtPnhzAVeVgs=
        run: uv run pytest tests/unit/test_org_admin_auth.py -q

  onboarding-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check onboarding web changes
        run: >-
          pnpm biome check
          apps/web/src/app/accept-invitation
          apps/web/src/middleware.ts
          apps/web/src/lib/locales/en-members.ts
          apps/web/src/lib/locales/de-members.ts
          apps/web/src/lib/locales/es-members.ts
          apps/web/e2e/onboarding-flow.spec.mjs
      - run: pnpm --filter @mailflow/web typecheck
      - run: npm --prefix apps/web/e2e install --no-package-lock --ignore-scripts
      - name: Install Chromium
        working-directory: apps/web/e2e
        run: npx playwright install --with-deps chromium
      - name: Run onboarding paths
        working-directory: apps/web/e2e
        run: npx playwright test onboarding-flow.spec.mjs -c playwright.config.mjs
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 3
