name: Finalize Issue 23 Backend
on:
  push:
    branches:
      - feat/23-dashboard-search
    paths:
      - .github/workflows/finalize-23-backend.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mailflow
          POSTGRES_PASSWORD: mailflow
          POSTGRES_DB: mailflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailflow -d mailflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/23-dashboard-search
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
        with:
          version: latest
          python-version: '3.13'
      - name: Add inference visibility and exact tag filtering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/app/services/dashboard.py')
          text = path.read_text()

          if 'import asyncio\n' not in text:
              text = text.replace(
                  'from __future__ import annotations\n\n',
                  'from __future__ import annotations\n\nimport asyncio\n',
                  1,
              )
          if 'from sqlalchemy.dialects.postgresql import JSONB\n' not in text:
              text = text.replace(
                  'from sqlalchemy.ext.asyncio import AsyncSession\n',
                  'from sqlalchemy.dialects.postgresql import JSONB\nfrom sqlalchemy.ext.asyncio import AsyncSession\n',
                  1,
              )
          if 'from app.inference_health import read_inference_health\n' not in text:
              text = text.replace(
                  'from app.dashboard_schemas import (',
                  'from app.inference_health import read_inference_health\nfrom app.dashboard_schemas import (',
                  1,
              )

          old = '''    mailboxes: list[DashboardMailboxStatus] = []\n    for account in accounts:\n        counts = mailbox_counts.get(account.id)\n        job = backfill_by_account.get(account.id)\n        health = "healthy" if account.is_active else "paused"\n        if job is not None and job.last_error:\n            health = "attention"\n        mailboxes.append('''
          new = '''    inference_by_account: dict[UUID, dict[str, object] | None] = {}\n    inference_status = "unknown"\n    inference_warning: str | None = None\n    try:\n        snapshots = await asyncio.wait_for(\n            asyncio.gather(*(read_inference_health(account.id) for account in accounts)),\n            timeout=1.5,\n        )\n        inference_by_account = dict(zip(account_ids, snapshots, strict=True))\n        if any(bool(snapshot and snapshot.get("degraded")) for snapshot in snapshots):\n            inference_status = "degraded"\n            inference_warning = "Inference is degraded for at least one authorized mailbox."\n        elif any(snapshot and snapshot.get("status") == "ok" for snapshot in snapshots):\n            inference_status = "ok"\n    except Exception:\n        # Dashboard availability must never depend on Redis health.\n        inference_by_account = {}\n\n    mailboxes: list[DashboardMailboxStatus] = []\n    for account in accounts:\n        counts = mailbox_counts.get(account.id)\n        job = backfill_by_account.get(account.id)\n        snapshot = inference_by_account.get(account.id)\n        health = "healthy" if account.is_active else "paused"\n        if snapshot and snapshot.get("degraded"):\n            health = "degraded"\n        if job is not None and job.last_error:\n            health = "attention"\n        mailboxes.append('''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'inference_by_account:' not in text:
              raise SystemExit('mailbox inference anchor missing')

          old_return = '''        handling=handling,\n        mailboxes=mailboxes,\n    )'''
          new_return = '''        handling=handling,\n        mailboxes=mailboxes,\n        inference_status=inference_status,\n        inference_warning=inference_warning,\n    )'''
          if old_return in text:
              text = text.replace(old_return, new_return, 1)
          elif 'inference_status=inference_status' not in text:
              raise SystemExit('dashboard return anchor missing')

          old_tag = '''    if tag:\n        predicates.append(\n            or_(\n                ProcessedEmail.system_tags.contains([tag]),\n                ProcessedEmail.user_tags.contains([tag]),\n            )\n        )'''
          new_tag = '''    if tag:\n        predicates.append(\n            or_(\n                cast(ProcessedEmail.system_tags, JSONB).op("?")(tag),\n                cast(ProcessedEmail.user_tags, JSONB).op("?")(tag),\n            )\n        )'''
          if old_tag in text:
              text = text.replace(old_tag, new_tag, 1)
          elif 'cast(ProcessedEmail.system_tags, JSONB)' not in text:
              raise SystemExit('tag filter anchor missing')
          path.write_text(text)
          PY
      - run: uv sync --all-packages
      - name: Format and lint
        run: |
          uv run ruff format apps/api/app/services/dashboard.py
          uv run ruff check apps/api/app/services/dashboard.py apps/api/tests/unit/test_dashboard.py
      - name: Test dashboard backend
        working-directory: apps/api
        env:
          SECRET_KEY: issue23-final-backend-test-key-000000000000000000
          REDIS_URL: redis://127.0.0.1:6399/0
        run: uv run pytest tests/unit/test_dashboard.py -q
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api
          git diff --cached --check
          git commit -m 'feat(dashboard): add inference health and exact tag filtering'
          git push origin HEAD:feat/23-dashboard-search
