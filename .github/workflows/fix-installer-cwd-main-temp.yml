name: Fix installer cwd on main (temporary)

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-installer-cwd-main-temp.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make installer independent of deleted current directory
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for name in ['scripts/install.sh', 'scripts/install-core.sh']:
              p = Path(name)
              text = p.read_text()
              marker = 'set -euo pipefail\n'
              insert = 'set -euo pipefail\n\n# Teardown may remove the directory the invoking shell is currently in.\n# Start from a stable directory so readline/tab completion and path hooks can resolve cwd.\ncd "$HOME"\n'
              if 'cd "$HOME"\n' not in text.split('\n', 12)[:12]:
                  if marker not in text:
                      raise SystemExit(f'marker not found in {name}')
                  text = text.replace(marker, insert, 1)
                  p.write_text(text)
          PY

          bash -n scripts/install.sh
          bash -n scripts/install-core.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/install.sh scripts/install-core.sh
          git commit -m "fix(installer): recover from deleted working directory"
          git push origin HEAD:main
