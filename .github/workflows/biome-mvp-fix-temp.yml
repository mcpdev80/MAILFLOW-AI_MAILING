name: Fix MVP Biome diagnostics (temporary)

on:
  push:
    branches:
      - feat/mvp-guidelines-figma-redesign

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mvp-guidelines-figma-redesign
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pnpm install --frozen-lockfile
      - name: Apply targeted Biome fixes
        run: |
          pnpm biome check --write --unsafe \
            apps/web/src/app/app/attachments/attachments-ui.tsx \
            apps/web/src/app/app/compose/page.tsx \
            apps/web/src/app/app/compose/compose-ui.tsx \
            apps/web/src/app/app/dashboard/dashboard-ui.tsx \
            apps/web/src/app/app/dashboard/page.tsx \
            apps/web/src/app/app/mail/mail-workspace-overlays.tsx \
            apps/web/src/app/app/mail/mail-workspace-content.tsx \
            apps/web/src/app/app/mail/use-mail-message-view.ts \
            apps/web/src/app/app/learning/page.tsx \
            apps/web/src/app/app/review/use-review-page.ts \
            apps/web/src/app/app/processing/page.tsx || true
          if git diff --quiet; then
            echo "No automatic changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: fix targeted MVP Biome diagnostics"
          git push origin HEAD:feat/mvp-guidelines-figma-redesign
