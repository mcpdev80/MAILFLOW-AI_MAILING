name: CI Fix Issue 58

on:
  push:
    branches: [feat/58-unified-inbox]

permissions:
  contents: write

jobs:
  fix:
    if: "${{ !contains(github.event.head_commit.message, 'feat(mail): structured thread insights') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: astral-sh/setup-uv@v4
        with:
          version: latest
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - name: Apply structured thread insights patch
        run: python .ci/issue58_structured_insights.py
      - run: pnpm biome check --write apps/web/src/lib/types.ts apps/web/src/app/app/mail/page.tsx
      - name: Format changed Python files
        shell: bash
        run: |
          base=$(git merge-base HEAD origin/main)
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base"...HEAD | grep -E '\.py$' || true)
          if (( ${#files[@]} )); then
            uv run ruff check --fix "${files[@]}"
            uv run ruff format "${files[@]}"
          fi
      - name: Commit feature
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/core/mailflow_core/classification/llm_client.py \
            apps/api/app/mail_client_schemas.py \
            apps/api/app/services/mail_client.py \
            apps/api/tests/unit/test_mail_client_services.py \
            apps/web/src/lib/types.ts \
            apps/web/src/app/app/mail/page.tsx
          if git diff --cached --quiet; then
            echo 'No feature changes needed'
          else
            git commit -m 'feat(mail): structured thread insights'
            git push
          fi
