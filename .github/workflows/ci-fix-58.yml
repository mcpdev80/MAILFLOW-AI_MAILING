name: CI Fix Issue 58

on:
  push:
    branches: [feat/58-unified-inbox]

permissions:
  contents: write

jobs:
  fix:
    if: "${{ !contains(github.event.head_commit.message, 'style: automated issue 58 fixes') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: astral-sh/setup-uv@v4
        with:
          version: latest
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - name: Keep HTML message rendering sandboxed
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/web/src/app/app/mail/page.tsx')
          text = path.read_text()
          if 'dangerouslySetInnerHTML' not in text:
              if 'className="mailBodyFrame"' not in text:
                  raise SystemExit('expected sandboxed mail body frame not found')
              raise SystemExit(0)
          pattern = re.compile(
              r'<div\s+className="mailBody"\s+'
              r'// The API strips active content, remote images, styles and unsafe attributes\.\s+'
              r'dangerouslySetInnerHTML=\{\{ __html: message\.safe_html \}\}\s*/>',
              re.MULTILINE,
          )
          replacement = '''<iframe
              className="mailBodyFrame"
              sandbox=""
              srcDoc={message.safe_html}
              title={`Message from ${message.from_email}`}
            />'''
          new_text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one unsafe HTML rendering block, found {count}')
          path.write_text(new_text)
          PY
      - run: pnpm biome check --write apps/web/src/lib/api.ts apps/web/src/app/app/mail/page.tsx
      - name: Format all changed Python files
        shell: bash
        run: |
          base=$(git merge-base HEAD origin/main)
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base"...HEAD | grep -E '\.py$' || true)
          if (( ${#files[@]} )); then
            uv run ruff check --fix "${files[@]}"
            uv run ruff format "${files[@]}"
          fi
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/lib/api.ts apps/web/src/app/app/mail/page.tsx
          base=$(git merge-base HEAD origin/main)
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base"...HEAD | grep -E '\.py$' || true)
          if (( ${#files[@]} )); then
            git add "${files[@]}"
          fi
          if git diff --cached --quiet; then
            echo 'No fixes needed'
          else
            git commit -m 'style: automated issue 58 fixes'
            git push
          fi
