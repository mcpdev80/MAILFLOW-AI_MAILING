name: LLM sources redesign validation (temporary)

on:
  push:
    branches:
      - test-mvp
    paths:
      - .github/workflows/llm-sources-redesign-temp.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-mvp
          fetch-depth: 0
      - name: Apply LLM sources redesign
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = Path("apps/api/alembic/versions/028_llm_role_assignments.py")
          migration.write_text('''"""Add organization LLM role assignments.\n\nRevision ID: 028\nRevises: 027\n"""\n\nfrom alembic import op\nimport sqlalchemy as sa\nfrom sqlalchemy.dialects import postgresql\n\nrevision = "028"\ndown_revision = "027"\nbranch_labels = None\ndepends_on = None\n\n\ndef upgrade() -> None:\n    op.create_table(\n        "llm_role_assignments",\n        sa.Column("org_id", postgresql.UUID(as_uuid=True), nullable=False),\n        sa.Column("role", sa.String(length=20), nullable=False),\n        sa.Column("provider_id", postgresql.UUID(as_uuid=True), nullable=False),\n        sa.Column("model_id", sa.String(length=200), nullable=False),\n        sa.Column("created_at", sa.DateTime(timezone=True), server_default=sa.func.now(), nullable=False),\n        sa.Column("updated_at", sa.DateTime(timezone=True), server_default=sa.func.now(), nullable=False),\n        sa.ForeignKeyConstraint(["org_id"], ["organizations.id"], ondelete="CASCADE"),\n        sa.ForeignKeyConstraint(["provider_id"], ["llm_providers.id"], ondelete="CASCADE"),\n        sa.PrimaryKeyConstraint("org_id", "role"),\n        sa.CheckConstraint("role IN ('fast', 'deep', 'generation')", name="ck_llm_role_assignments_role"),\n    )\n    op.create_index("ix_llm_role_assignments_provider", "llm_role_assignments", ["provider_id"])\n\n\ndef downgrade() -> None:\n    op.drop_index("ix_llm_role_assignments_provider", table_name="llm_role_assignments")\n    op.drop_table("llm_role_assignments")\n''')

          schemas = Path("apps/api/app/llm_schemas.py")
          text = schemas.read_text()
          text = text.replace("from typing import", "from typing import") if "from typing import" in text else text.replace("from uuid import UUID\n", "from typing import Literal\nfrom uuid import UUID\n")
          anchor = "\n\nclass LLMProviderOut(BaseModel):\n"
          addition = '''\n\nclass LLMRoleAssignment(BaseModel):\n    role: Literal["fast", "deep", "generation"]\n    provider_id: UUID\n    model_id: str = Field(min_length=1, max_length=200)\n\n\nclass LLMRoleAssignmentsOut(BaseModel):\n    fast: LLMRoleAssignment | None = None\n    deep: LLMRoleAssignment | None = None\n    generation: LLMRoleAssignment | None = None\n\n\nclass LLMRoleAssignmentsUpdate(BaseModel):\n    fast: LLMRoleAssignment | None = None\n    deep: LLMRoleAssignment | None = None\n    generation: LLMRoleAssignment | None = None\n'''
          if "class LLMRoleAssignment(" not in text:
              if anchor not in text:
                  raise SystemExit("llm_schemas anchor missing")
              text = text.replace(anchor, addition + anchor, 1)
          schemas.write_text(text)

          router = Path("apps/api/app/routers/llm_providers.py")
          text = router.read_text()
          text = text.replace("from sqlalchemy import select\n", "from sqlalchemy import select, text\n")
          text = text.replace("from app.crypto import encrypt_secret\n", "from app.crypto import decrypt_secret, encrypt_secret\n")
          text = text.replace("    LLMModelDiscoveryRequest,\n", "    LLMModelDiscoveryRequest,\n    LLMRoleAssignment,\n    LLMRoleAssignmentsOut,\n    LLMRoleAssignmentsUpdate,\n")
          start = text.index("def _fetch_model_ids(")
          end = text.index("\n\n@router.get(\"\", response_model=list[LLMProviderOut])", start)
          replacement = '''def _fetch_model_ids(\n    url: str, api_key: str | None, *, provider_type: str\n) -> list[str]:\n    headers = {"Accept": "application/json"}\n    if api_key:\n        if provider_type == "anthropic":\n            headers["x-api-key"] = api_key\n            headers["anthropic-version"] = "2023-06-01"\n        elif provider_type != "gemini":\n            headers["Authorization"] = f"Bearer {api_key}"\n\n    request = Request(url, headers=headers, method="GET")\n    with urlopen(request, timeout=8) as response:  # noqa: S310 - admin-configured endpoint\n        payload = json.loads(response.read().decode("utf-8"))\n\n    if provider_type == "ollama":\n        raw_models = payload.get("models", []) if isinstance(payload, dict) else []\n        values = [item.get("name") for item in raw_models if isinstance(item, dict)]\n    elif provider_type == "gemini":\n        raw_models = payload.get("models", []) if isinstance(payload, dict) else []\n        values = [\n            str(item.get("name", "")).removeprefix("models/")\n            for item in raw_models\n            if isinstance(item, dict)\n        ]\n    else:\n        raw_models = payload.get("data", []) if isinstance(payload, dict) else []\n        values = [item.get("id") for item in raw_models if isinstance(item, dict)]\n\n    return sorted({value for value in values if isinstance(value, str) and value.strip()})\n\n\ndef _discover_models(payload: LLMModelDiscoveryRequest) -> list[str]:\n    base_url = payload.base_url.strip().rstrip("/")\n    if not base_url.startswith(("http://", "https://")):\n        raise ValueError("provider_url_must_use_http_or_https")\n\n    provider_type = payload.type.strip().lower()\n    if provider_type == "ollama":\n        return _fetch_model_ids(_ollama_models_url(base_url), payload.api_key, provider_type=provider_type)\n    if provider_type == "gemini":\n        url = f"{base_url}/models"\n        if payload.api_key:\n            url = f"{url}?key={payload.api_key}"\n        return _fetch_model_ids(url, payload.api_key, provider_type=provider_type)\n    return _fetch_model_ids(_openai_models_url(base_url), payload.api_key, provider_type=provider_type)\n'''
          text = text[:start] + replacement + text[end:]
          discover_anchor = '''@router.post("", response_model=LLMProviderOut, status_code=status.HTTP_201_CREATED)\n'''
          extra = '''@router.get("/role-assignments", response_model=LLMRoleAssignmentsOut)\nasync def get_role_assignments(\n    org: Organization = Depends(require_org),\n    session: AsyncSession = Depends(get_session),\n) -> LLMRoleAssignmentsOut:\n    rows = await session.execute(\n        text(\n            "SELECT role, provider_id, model_id FROM llm_role_assignments "\n            "WHERE org_id = :org_id"\n        ),\n        {"org_id": org.id},\n    )\n    values = {\n        row.role: LLMRoleAssignment(\n            role=row.role, provider_id=row.provider_id, model_id=row.model_id\n        )\n        for row in rows\n    }\n    return LLMRoleAssignmentsOut(\n        fast=values.get("fast"),\n        deep=values.get("deep"),\n        generation=values.get("generation"),\n    )\n\n\n@router.put("/role-assignments", response_model=LLMRoleAssignmentsOut)\nasync def put_role_assignments(\n    payload: LLMRoleAssignmentsUpdate,\n    org: Organization = Depends(require_org_admin),\n    session: AsyncSession = Depends(get_session),\n) -> LLMRoleAssignmentsOut:\n    assignments = [item for item in (payload.fast, payload.deep, payload.generation) if item is not None]\n    for item in assignments:\n        if item.role not in {"fast", "deep", "generation"}:\n            raise HTTPException(status_code=422, detail="invalid_llm_role")\n        provider = await _get_owned(item.provider_id, org, session)\n        if not provider.is_active:\n            raise HTTPException(status_code=422, detail="llm_provider_inactive")\n        await session.execute(\n            text(\n                "INSERT INTO llm_role_assignments (org_id, role, provider_id, model_id) "\n                "VALUES (:org_id, :role, :provider_id, :model_id) "\n                "ON CONFLICT (org_id, role) DO UPDATE SET "\n                "provider_id = EXCLUDED.provider_id, model_id = EXCLUDED.model_id, updated_at = now()"\n            ),\n            {"org_id": org.id, "role": item.role, "provider_id": item.provider_id, "model_id": item.model_id},\n        )\n    await session.commit()\n    return await get_role_assignments(org, session)\n\n\n@router.get("/{provider_id}/models", response_model=LLMModelDiscoveryOut)\nasync def discover_saved_provider_models(\n    provider_id: UUID,\n    org: Organization = Depends(require_org_admin),\n    session: AsyncSession = Depends(get_session),\n) -> LLMModelDiscoveryOut:\n    provider = await _get_owned(provider_id, org, session)\n    api_key = None\n    if provider.encrypted_api_key:\n        api_key = str(decrypt_secret(provider.encrypted_api_key)["api_key"])\n    request_payload = LLMModelDiscoveryRequest(\n        type=provider.type, base_url=provider.base_url, api_key=api_key\n    )\n    try:\n        models = await asyncio.to_thread(_discover_models, request_payload)\n    except (HTTPError, URLError, TimeoutError, json.JSONDecodeError, UnicodeDecodeError) as exc:\n        raise HTTPException(status_code=502, detail="model_discovery_connection_failed") from exc\n    if not models:\n        raise HTTPException(status_code=404, detail="no_models_discovered")\n    return LLMModelDiscoveryOut(models=models)\n\n\n'''
          if "@router.get(\"/role-assignments\"" not in text:
              if discover_anchor not in text:
                  raise SystemExit("router create anchor missing")
              text = text.replace(discover_anchor, extra + discover_anchor, 1)
          router.write_text(text)

          account = Path("apps/api/app/repositories/account.py")
          text = account.read_text()
          if "from types import SimpleNamespace" not in text:
              text = text.replace("from datetime import datetime\n", "from datetime import datetime\nfrom types import SimpleNamespace\n")
          old = "        return account, account_config, account.llm_provider\n"
          new = '''        resolved_provider = await self._resolve_role_provider(\n            account.org_id, account.llm_provider\n        )\n        return account, account_config, resolved_provider\n\n    async def _resolve_role_provider(\n        self, org_id: UUID, fallback: LLMProvider | None\n    ) -> LLMProvider | None:\n        rows = list(\n            (\n                await self._session.execute(\n                    text(\n                        "SELECT role, provider_id, model_id FROM llm_role_assignments "\n                        "WHERE org_id = :org_id"\n                    ),\n                    {"org_id": org_id},\n                )\n            )\n        )\n        if not rows:\n            return fallback\n\n        provider_ids = {row.provider_id for row in rows}\n        providers = list(\n            (\n                await self._session.execute(\n                    select(LLMProvider).where(\n                        LLMProvider.org_id == org_id,\n                        LLMProvider.id.in_(provider_ids),\n                        LLMProvider.is_active.is_(True),\n                    )\n                )\n            ).scalars()\n        )\n        by_id = {provider.id: provider for provider in providers}\n        assignments = {row.role: row for row in rows if row.provider_id in by_id}\n        if not assignments:\n            return fallback\n\n        def provider_for(role: str) -> LLMProvider | None:\n            item = assignments.get(role)\n            if item is not None:\n                return by_id.get(item.provider_id)\n            return fallback\n\n        def model_for(role: str, provider: LLMProvider | None) -> str | None:\n            item = assignments.get(role)\n            if item is not None and item.model_id:\n                return str(item.model_id)\n            if provider is None:\n                return None\n            if role == "generation":\n                return provider.generation_model or provider.default_generation_model\n            if role == "deep":\n                return provider.deep_classification_model or provider.default_classification_model\n            return provider.fast_classification_model or provider.default_classification_model\n\n        fast_provider = provider_for("fast")\n        deep_provider = provider_for("deep") or fast_provider\n        generation_provider = provider_for("generation") or fallback or fast_provider\n        if fast_provider is None:\n            fast_provider = deep_provider or generation_provider\n        if fast_provider is None:\n            return fallback\n\n        fast_model = model_for("fast", fast_provider) or fast_provider.default_classification_model\n        deep_model = model_for("deep", deep_provider) or fast_model\n        generation_model = model_for("generation", generation_provider) or fast_model\n        return SimpleNamespace(\n            is_active=True,\n            base_url=fast_provider.base_url,\n            encrypted_api_key=fast_provider.encrypted_api_key,\n            default_classification_model=fast_model,\n            default_generation_model=generation_model,\n            fast_classification_model=fast_model,\n            deep_classification_model=deep_model,\n            generation_model=generation_model,\n            fast_classification_base_url=fast_provider.base_url,\n            deep_classification_base_url=deep_provider.base_url if deep_provider else fast_provider.base_url,\n            generation_base_url=generation_provider.base_url if generation_provider else fast_provider.base_url,\n            encrypted_fast_api_key=fast_provider.encrypted_api_key,\n            encrypted_deep_api_key=deep_provider.encrypted_api_key if deep_provider else fast_provider.encrypted_api_key,\n            encrypted_generation_api_key=generation_provider.encrypted_api_key if generation_provider else fast_provider.encrypted_api_key,\n        )\n'''
          if old not in text:
              raise SystemExit("account return anchor missing")
          text = text.replace(old, new, 1)
          account.write_text(text)

          api = Path("apps/web/src/lib/api.ts")
          text = api.read_text()
          text = text.replace("  LLMProviderUpdate,\n", "  LLMProviderUpdate,\n  LLMRoleAssignments,\n  LLMRoleAssignmentsUpdate,\n")
          old = '''  updateProvider: (id: string, payload: LLMProviderUpdate) =>\n    request<LLMProvider>(`/llm-providers/${id}`, {\n      method: "PATCH",\n      body: JSON.stringify(payload),\n    }),\n'''
          new = old + '''  deleteProvider: (id: string) =>\n    request<void>(`/llm-providers/${id}`, { method: "DELETE" }),\n  listProviderModels: (id: string) =>\n    request<{ models: string[] }>(`/llm-providers/${id}/models`),\n  getLLMRoleAssignments: () =>\n    request<LLMRoleAssignments>("/llm-providers/role-assignments"),\n  updateLLMRoleAssignments: (payload: LLMRoleAssignmentsUpdate) =>\n    request<LLMRoleAssignments>("/llm-providers/role-assignments", {\n      method: "PUT",\n      body: JSON.stringify(payload),\n    }),\n'''
          if "deleteProvider:" not in text:
              if old not in text:
                  raise SystemExit("api provider anchor missing")
              text = text.replace(old, new, 1)
          api.write_text(text)

          types = Path("apps/web/src/lib/types.ts")
          text = types.read_text()
          anchor = "\nexport interface Cycle {\n"
          addition = '''\nexport type LLMRole = "fast" | "deep" | "generation";\n\nexport interface LLMRoleAssignment {\n  role: LLMRole;\n  provider_id: string;\n  model_id: string;\n}\n\nexport interface LLMRoleAssignments {\n  fast: LLMRoleAssignment | null;\n  deep: LLMRoleAssignment | null;\n  generation: LLMRoleAssignment | null;\n}\n\nexport type LLMRoleAssignmentsUpdate = Partial<LLMRoleAssignments>;\n'''
          if "export type LLMRole =" not in text:
              text = text.replace(anchor, addition + anchor, 1)
          types.write_text(text)

          controller = Path("apps/web/src/app/app/settings/models/use-model-settings.ts")
          controller.write_text('''"use client";\n\nimport { ApiError, api } from "@/lib/api";\nimport type { LLMProvider, LLMRole, LLMRoleAssignment, LLMRoleAssignments } from "@/lib/types";\nimport { useCallback, useEffect, useMemo, useState } from "react";\n\nexport type SourceDraft = { label: string; type: string; baseUrl: string; apiKey: string; model: string };\nexport type RoleDraft = Record<LLMRole, { providerId: string; modelId: string }>;\n\nconst providerDefaults: Record<string, string> = {\n  "openai-compatible": "http://localhost:8000/v1",\n  openai: "https://api.openai.com/v1",\n  anthropic: "https://api.anthropic.com/v1",\n  gemini: "https://generativelanguage.googleapis.com/v1beta",\n  openrouter: "https://openrouter.ai/api/v1",\n  ollama: "http://localhost:11434",\n};\n\nexport const providerTypes = Object.keys(providerDefaults);\n\nexport function useModelSettings() {\n  const [providers, setProviders] = useState<LLMProvider[]>([]);\n  const [assignments, setAssignments] = useState<LLMRoleAssignments>({ fast: null, deep: null, generation: null });\n  const [roles, setRoles] = useState<RoleDraft>({ fast: { providerId: "", modelId: "" }, deep: { providerId: "", modelId: "" }, generation: { providerId: "", modelId: "" } });\n  const [models, setModels] = useState<Record<string, string[]>>({});\n  const [sourceDraft, setSourceDraft] = useState<SourceDraft>({ label: "", type: "openai-compatible", baseUrl: providerDefaults["openai-compatible"], apiKey: "", model: "" });\n  const [showAdd, setShowAdd] = useState(false);\n  const [editingId, setEditingId] = useState<string | null>(null);\n  const [loading, setLoading] = useState(true);\n  const [busy, setBusy] = useState(false);\n  const [error, setError] = useState<string | null>(null);\n  const [notice, setNotice] = useState<string | null>(null);\n\n  const activeProviders = useMemo(() => providers.filter((item) => item.is_active), [providers]);\n\n  const syncRoles = useCallback((items: LLMProvider[], value: LLMRoleAssignments) => {\n    const fallback = items.find((item) => item.is_active) ?? items[0];\n    const next = { fast: roleValue("fast", value.fast, fallback), deep: roleValue("deep", value.deep, fallback), generation: roleValue("generation", value.generation, fallback) };\n    setRoles(next);\n  }, []);\n\n  const load = useCallback(async () => {\n    setLoading(true); setError(null);\n    try {\n      const [items, roleValues] = await Promise.all([api.listProviders(), api.getLLMRoleAssignments()]);\n      setProviders(items); setAssignments(roleValues); syncRoles(items, roleValues);\n    } catch (err) { setError(messageOf(err, "model_settings_load_failed")); }\n    finally { setLoading(false); }\n  }, [syncRoles]);\n\n  useEffect(() => { void load(); }, [load]);\n\n  function setSourceType(type: string) {\n    setSourceDraft((current) => ({ ...current, type, baseUrl: providerDefaults[type] ?? current.baseUrl }));\n  }\n\n  async function discoverDraftModels() {\n    setBusy(true); setError(null);\n    try {\n      const result = await api.discoverProviderModels({ type: sourceDraft.type, base_url: sourceDraft.baseUrl, api_key: sourceDraft.apiKey || null });\n      setModels((current) => ({ ...current, draft: result.models }));\n      if (!sourceDraft.model && result.models[0]) setSourceDraft((current) => ({ ...current, model: result.models[0] }));\n      setNotice("models");\n    } catch (err) { setError(messageOf(err, "model_discovery_failed")); }\n    finally { setBusy(false); }\n  }\n\n  async function addSource() {\n    if (!sourceDraft.label.trim() || !sourceDraft.baseUrl.trim() || !sourceDraft.model.trim()) { setError("source_fields_required"); return; }\n    setBusy(true); setError(null);\n    try {\n      await api.createProvider({ label: sourceDraft.label.trim(), type: sourceDraft.type, base_url: sourceDraft.baseUrl.trim(), api_key: sourceDraft.apiKey || null, default_classification_model: sourceDraft.model.trim(), default_generation_model: sourceDraft.model.trim() });\n      setShowAdd(false); setSourceDraft({ label: "", type: "openai-compatible", baseUrl: providerDefaults["openai-compatible"], apiKey: "", model: "" });\n      setModels((current) => { const next = { ...current }; delete next.draft; return next; });\n      await load(); setNotice("created");\n    } catch (err) { setError(messageOf(err, "model_settings_save_failed")); }\n    finally { setBusy(false); }\n  }\n\n  async function discoverSource(id: string) {\n    setBusy(true); setError(null);\n    try { const result = await api.listProviderModels(id); setModels((current) => ({ ...current, [id]: result.models })); setNotice("models"); }\n    catch (err) { setError(messageOf(err, "model_discovery_failed")); }\n    finally { setBusy(false); }\n  }\n\n  async function toggleSource(provider: LLMProvider) {\n    setBusy(true); setError(null);\n    try { await api.updateProvider(provider.id, { is_active: !provider.is_active }); await load(); }\n    catch (err) { setError(messageOf(err, "model_settings_save_failed")); } finally { setBusy(false); }\n  }\n\n  async function removeSource(provider: LLMProvider) {\n    setBusy(true); setError(null);\n    try { await api.deleteProvider(provider.id); await load(); setNotice("deleted"); }\n    catch (err) { setError(messageOf(err, "model_settings_save_failed")); } finally { setBusy(false); }\n  }\n\n  async function saveSource(provider: LLMProvider, values: { label: string; baseUrl: string; apiKey: string }) {\n    setBusy(true); setError(null);\n    try { await api.updateProvider(provider.id, { label: values.label, base_url: values.baseUrl, ...(values.apiKey ? { api_key: values.apiKey } : {}) }); setEditingId(null); await load(); setNotice("saved"); }\n    catch (err) { setError(messageOf(err, "model_settings_save_failed")); } finally { setBusy(false); }\n  }\n\n  async function setRoleProvider(role: LLMRole, providerId: string) {\n    const provider = providers.find((item) => item.id === providerId);\n    if (!provider) return;\n    if (!models[providerId]) await discoverSource(providerId);\n    const known = models[providerId] ?? [];\n    const fallbackModel = role === "generation" ? provider.generation_model ?? provider.default_generation_model : role === "deep" ? provider.deep_classification_model ?? provider.default_classification_model : provider.fast_classification_model ?? provider.default_classification_model;\n    setRoles((current) => ({ ...current, [role]: { providerId, modelId: known[0] ?? fallbackModel } }));\n  }\n\n  function setRoleModel(role: LLMRole, modelId: string) { setRoles((current) => ({ ...current, [role]: { ...current[role], modelId } })); }\n\n  async function saveRoles() {\n    const payload: Record<string, LLMRoleAssignment> = {};\n    for (const role of ["fast", "deep", "generation"] as const) {\n      const value = roles[role];\n      if (!value.providerId || !value.modelId) { setError("role_fields_required"); return; }\n      payload[role] = { role, provider_id: value.providerId, model_id: value.modelId };\n    }\n    setBusy(true); setError(null);\n    try { const updated = await api.updateLLMRoleAssignments(payload); setAssignments(updated); syncRoles(providers, updated); setNotice("roles"); }\n    catch (err) { setError(messageOf(err, "model_settings_save_failed")); } finally { setBusy(false); }\n  }\n\n  return { providers, activeProviders, assignments, roles, models, sourceDraft, setSourceDraft, setSourceType, showAdd, setShowAdd, editingId, setEditingId, loading, busy, error, notice, reload: load, discoverDraftModels, addSource, discoverSource, toggleSource, removeSource, saveSource, setRoleProvider, setRoleModel, saveRoles };\n}\n\nfunction roleValue(role: LLMRole, assignment: LLMRoleAssignment | null, fallback?: LLMProvider) {\n  if (assignment) return { providerId: assignment.provider_id, modelId: assignment.model_id };\n  if (!fallback) return { providerId: "", modelId: "" };\n  const modelId = role === "generation" ? fallback.generation_model ?? fallback.default_generation_model : role === "deep" ? fallback.deep_classification_model ?? fallback.default_classification_model : fallback.fast_classification_model ?? fallback.default_classification_model;\n  return { providerId: fallback.id, modelId };\n}\n\nfunction messageOf(error: unknown, fallback: string) { return error instanceof ApiError || error instanceof Error ? error.message : fallback; }\n\nexport type ModelSettingsController = ReturnType<typeof useModelSettings>;\n''')

          ui = Path("apps/web/src/app/app/settings/models/model-settings-ui.tsx")
          ui.write_text('''"use client";\n\nimport { useI18n } from "@/lib/i18n";\nimport type { LLMProvider, LLMRole } from "@/lib/types";\nimport Link from "next/link";\nimport { useState } from "react";\nimport { type ModelSettingsController, providerTypes } from "./use-model-settings";\n\nexport function ModelSettingsUi({ controller }: { controller: ModelSettingsController }) {\n  const { t } = useI18n();\n  if (controller.loading) return <main className="container" style={{ maxWidth: 1100, margin: "0 auto" }}><div className="card muted">{t("models.loading")}</div></main>;\n  return (\n    <main className="container" style={{ maxWidth: 1100, margin: "0 auto" }}>\n      <p><Link href="/app/dashboard">← {t("models.back")}</Link></p>\n      <h1>{t("models.title")}</h1>\n      <p className="muted">{t("models.description")}</p>\n      {controller.error && <div className="alert error">{errorText(controller.error, t)}</div>}\n      {controller.notice && <div className="alert ok">{noticeText(controller.notice, t)}</div>}\n\n      <section style={{ marginTop: 24 }}>\n        <div className="row" style={{ alignItems: "center", justifyContent: "space-between" }}>\n          <div><h2>{t("models.sources")}</h2><p className="muted">{t("models.sourcesDescription")}</p></div>\n          <button className="btn" type="button" onClick={() => controller.setShowAdd(!controller.showAdd)}>+ {t("models.addSource")}</button>\n        </div>\n        {controller.showAdd && <AddSource controller={controller} />}\n        <div style={{ display: "grid", gap: 12, marginTop: 14 }}>\n          {controller.providers.map((provider) => <SourceCard key={provider.id} provider={provider} controller={controller} />)}\n          {controller.providers.length === 0 && <div className="card muted">{t("models.empty")}</div>}\n        </div>\n      </section>\n\n      <section className="card" style={{ marginTop: 28 }}>\n        <h2>{t("models.roles")}</h2>\n        <p className="muted">{t("models.rolesDescription")}</p>\n        <RoleRow role="fast" title={t("models.fast")} controller={controller} />\n        <RoleRow role="deep" title={t("models.deep")} controller={controller} />\n        <RoleRow role="generation" title={t("models.generation")} controller={controller} />\n        <button className="btn" type="button" disabled={controller.busy || controller.activeProviders.length === 0} onClick={() => void controller.saveRoles()}>\n          {controller.busy ? t("models.saving") : t("models.save")}\n        </button>\n      </section>\n    </main>\n  );\n}\n\nfunction AddSource({ controller }: { controller: ModelSettingsController }) {\n  const { t } = useI18n();\n  const draftModels = controller.models.draft ?? [];\n  return <div className="card" style={{ marginTop: 12 }}>\n    <h3>{t("models.newSource")}</h3>\n    <div className="row">\n      <Field label={t("models.sourceName")} value={controller.sourceDraft.label} onChange={(label) => controller.setSourceDraft((c) => ({ ...c, label }))} />\n      <label className="field"><span>{t("models.providerType")}</span><select value={controller.sourceDraft.type} onChange={(e) => controller.setSourceType(e.target.value)}>{providerTypes.map((type) => <option key={type} value={type}>{providerLabel(type)}</option>)}</select></label>\n    </div>\n    <div className="row">\n      <Field label={t("models.baseUrl")} value={controller.sourceDraft.baseUrl} onChange={(baseUrl) => controller.setSourceDraft((c) => ({ ...c, baseUrl }))} />\n      <Field label={t("models.apiKey")} type="password" value={controller.sourceDraft.apiKey} onChange={(apiKey) => controller.setSourceDraft((c) => ({ ...c, apiKey }))} />\n    </div>\n    <div className="row" style={{ alignItems: "end" }}>\n      <label className="field"><span>{t("models.model")}</span>{draftModels.length ? <select value={controller.sourceDraft.model} onChange={(e) => controller.setSourceDraft((c) => ({ ...c, model: e.target.value }))}><option value="">{t("models.selectModel")}</option>{draftModels.map((model) => <option key={model} value={model}>{model}</option>)}</select> : <input value={controller.sourceDraft.model} onChange={(e) => controller.setSourceDraft((c) => ({ ...c, model: e.target.value }))} placeholder={t("models.manualModel")} />}</label>\n      <button className="btn secondary" type="button" disabled={controller.busy} onClick={() => void controller.discoverDraftModels()}>{t("models.testAndLoad")}</button>\n    </div>\n    <div style={{ display: "flex", gap: 8 }}><button className="btn" type="button" disabled={controller.busy} onClick={() => void controller.addSource()}>{t("models.createSource")}</button><button className="btn secondary" type="button" onClick={() => controller.setShowAdd(false)}>{t("models.cancel")}</button></div>\n  </div>;\n}\n\nfunction SourceCard({ provider, controller }: { provider: LLMProvider; controller: ModelSettingsController }) {\n  const { t } = useI18n();\n  const [label, setLabel] = useState(provider.label);\n  const [baseUrl, setBaseUrl] = useState(provider.base_url);\n  const [apiKey, setApiKey] = useState("");\n  const editing = controller.editingId === provider.id;\n  const known = controller.models[provider.id] ?? [];\n  return <div className="card" style={{ opacity: provider.is_active ? 1 : 0.65 }}>\n    <div className="row" style={{ alignItems: "center", justifyContent: "space-between" }}>\n      <div><strong>{provider.label}</strong><div className="muted">{providerLabel(provider.type)} · {provider.base_url}</div><div className="muted">{provider.is_active ? t("models.active") : t("models.inactive")}{known.length ? ` · ${known.length} ${t("models.modelsFound")}` : ""}</div></div>\n      <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>\n        <button className="btn secondary" type="button" onClick={() => void controller.discoverSource(provider.id)}>{t("models.test")}</button>\n        <button className="btn secondary" type="button" onClick={() => controller.setEditingId(editing ? null : provider.id)}>{t("models.edit")}</button>\n        <button className="btn secondary" type="button" onClick={() => void controller.toggleSource(provider)}>{provider.is_active ? t("models.disable") : t("models.enable")}</button>\n        <button className="btn secondary" type="button" onClick={() => { if (window.confirm(t("models.deleteConfirm"))) void controller.removeSource(provider); }}>{t("models.delete")}</button>\n      </div>\n    </div>\n    {editing && <div style={{ marginTop: 12 }}><div className="row"><Field label={t("models.sourceName")} value={label} onChange={setLabel} /><Field label={t("models.baseUrl")} value={baseUrl} onChange={setBaseUrl} /></div><Field label={t("models.newApiKey")} type="password" value={apiKey} onChange={setApiKey} /><button className="btn" type="button" onClick={() => void controller.saveSource(provider, { label, baseUrl, apiKey })}>{t("models.saveSource")}</button></div>}\n    {known.length > 0 && <div className="muted" style={{ marginTop: 10, wordBreak: "break-word" }}>{known.slice(0, 8).join(" · ")}{known.length > 8 ? ` · +${known.length - 8}` : ""}</div>}\n  </div>;\n}\n\nfunction RoleRow({ role, title, controller }: { role: LLMRole; title: string; controller: ModelSettingsController }) {\n  const { t } = useI18n();\n  const value = controller.roles[role];\n  const provider = controller.providers.find((item) => item.id === value.providerId);\n  const known = value.providerId ? controller.models[value.providerId] ?? [] : [];\n  const fallbackModels = provider ? [role === "generation" ? provider.generation_model ?? provider.default_generation_model : role === "deep" ? provider.deep_classification_model ?? provider.default_classification_model : provider.fast_classification_model ?? provider.default_classification_model] : [];\n  const options = Array.from(new Set([...known, ...fallbackModels].filter(Boolean) as string[]));\n  return <div style={{ margin: "20px 0", paddingTop: 14, borderTop: "1px solid var(--border, #2a2d36)" }}><h3>{title}</h3><div className="row"><label className="field"><span>{t("models.source")}</span><select value={value.providerId} onChange={(e) => void controller.setRoleProvider(role, e.target.value)}><option value="">{t("models.selectSource")}</option>{controller.activeProviders.map((item) => <option key={item.id} value={item.id}>{item.label} · {providerLabel(item.type)}</option>)}</select></label><label className="field"><span>{t("models.model")}</span>{options.length ? <select value={value.modelId} onChange={(e) => controller.setRoleModel(role, e.target.value)}>{options.map((model) => <option key={model} value={model}>{model}</option>)}</select> : <input value={value.modelId} onChange={(e) => controller.setRoleModel(role, e.target.value)} placeholder={t("models.manualModel")} />}</label></div></div>;\n}\n\nfunction Field({ label, value, onChange, type = "text" }: { label: string; value: string; onChange: (value: string) => void; type?: string }) { return <label className="field"><span>{label}</span><input type={type} value={value} onChange={(e) => onChange(e.target.value)} /></label>; }\nfunction providerLabel(type: string) { return ({ "openai-compatible": "OpenAI-compatible", openai: "OpenAI", anthropic: "Anthropic / Claude", gemini: "Google Gemini", openrouter: "OpenRouter", ollama: "Ollama" } as Record<string, string>)[type] ?? type; }\nfunction errorText(value: string, t: ReturnType<typeof useI18n>["t"]) { if (value === "source_fields_required") return t("models.sourceFieldsRequired"); if (value === "role_fields_required") return t("models.roleFieldsRequired"); if (value.includes("discovery")) return t("models.discoveryFailed"); return value; }\nfunction noticeText(value: string, t: ReturnType<typeof useI18n>["t"]) { if (value === "created") return t("models.sourceCreated"); if (value === "deleted") return t("models.sourceDeleted"); if (value === "models") return t("models.modelsLoaded"); if (value === "roles") return t("models.saved"); return t("models.sourceSaved"); }\n''')

