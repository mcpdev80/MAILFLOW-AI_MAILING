name: Admin role separation validation (temporary)

on:
  push:
    branches: [test-mvp]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec biome check apps/web/src
      - run: pnpm --filter @mailflow/web typecheck
