name: Admin role separation validation (temporary)

on:
  push:
    branches: [test-mvp]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: >-
          pnpm exec biome check
          apps/web/src/lib/access-context.ts
          apps/web/src/app/api/access-context/route.ts
          apps/web/src/app/api/instance-organizations/route.ts
          apps/web/src/components/admin-shell.tsx
          apps/web/src/app/admin/instance/layout.tsx
          apps/web/src/app/admin/org/layout.tsx
          apps/web/src/app/admin/instance/page.tsx
          apps/web/src/app/admin/org/page.tsx
          apps/web/src/app/admin/org/members/page.tsx
          apps/web/src/app/admin/org/models/page.tsx
          apps/web/src/app/admin/instance/organizations/page.tsx
          apps/web/src/app/login/use-login-page.ts
          apps/web/src/components/settings-shell.tsx
          apps/web/src/app/app/settings/members/page.tsx
          apps/web/src/app/app/settings/models/page.tsx
          apps/web/src/components/app-shell.tsx
      - run: pnpm --filter @mailflow/web typecheck
