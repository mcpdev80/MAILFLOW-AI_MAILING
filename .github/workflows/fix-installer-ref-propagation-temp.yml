name: Fix installer ref propagation (temporary)

on:
  push:
    branches:
      - test-mvp
    paths:
      - .github/workflows/fix-installer-ref-propagation-temp.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-mvp
      - name: Make installer ref explicit and propagate it
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # install.sh: caller may pass a ref as arg1 or MAILFLOW_INSTALL_REF.
          p = Path('scripts/install.sh')
          text = p.read_text()
          text = text.replace('BRANCH="test-mvp"\n', 'BRANCH="${MAILFLOW_INSTALL_REF:-${1:-main}}"\nexport MAILFLOW_INSTALL_REF="$BRANCH"\n', 1)
          text = text.replace('MAILFLOW_SKIP_SELF_UPDATE=1 exec bash "$DEFAULT_INSTALL/scripts/resume.sh" "$DEFAULT_INSTALL"', 'MAILFLOW_INSTALL_REF="$BRANCH" MAILFLOW_SKIP_SELF_UPDATE=1 exec bash "$DEFAULT_INSTALL/scripts/resume.sh" "$DEFAULT_INSTALL"')
          text = text.replace('exec bash <(curl -fsSL "$RAW_BASE/install-core.sh")', 'MAILFLOW_INSTALL_REF="$BRANCH" exec bash <(curl -fsSL "$RAW_BASE/install-core.sh") "$BRANCH"')
          p.write_text(text)

          # install-core.sh: inherit the same ref, falling back to arg1/main.
          p = Path('scripts/install-core.sh')
          text = p.read_text()
          text = text.replace('BRANCH="test-mvp"\n', 'BRANCH="${MAILFLOW_INSTALL_REF:-${1:-main}}"\nexport MAILFLOW_INSTALL_REF="$BRANCH"\n', 1)
          p.write_text(text)

          # resume.sh: never hard-code a branch. Prefer propagated ref; otherwise
          # use the currently checked-out branch, finally main.
          p = Path('scripts/resume.sh')
          text = p.read_text()
          text = text.replace('BRANCH="feat/mvp-guidelines-figma-redesign"\n', 'CURRENT_BRANCH="$(git -C "${1:-$HOME/mailflow}" branch --show-current 2>/dev/null || true)"\nBRANCH="${MAILFLOW_INSTALL_REF:-${CURRENT_BRANCH:-main}}"\nexport MAILFLOW_INSTALL_REF="$BRANCH"\n', 1)
          p.write_text(text)
          PY

          bash -n scripts/install.sh
          bash -n scripts/install-core.sh
          bash -n scripts/resume.sh

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/install.sh scripts/install-core.sh scripts/resume.sh
          git commit -m "fix(installer): propagate selected git ref through install flow"
          git push origin HEAD:test-mvp
