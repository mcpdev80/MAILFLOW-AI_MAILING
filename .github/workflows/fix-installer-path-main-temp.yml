name: Fix installer path UX on main (temporary)

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-installer-path-main-temp.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore editable path completion and main branch installer target
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for path in [Path('scripts/install.sh'), Path('scripts/install-core.sh')]:
              text = path.read_text()
              text = text.replace('BRANCH="feat/mvp-guidelines-figma-redesign"', 'BRANCH="main"')
              path.write_text(text)

          p = Path('scripts/install-core.sh')
          text = p.read_text()
          old = '''prompt_path() {
            local label="$1" default="$2" value
            if [ -r /dev/tty ]; then
              IFS= read -e -r -p "$label [$default]: " value < /dev/tty || true
            else
              value=""
            fi
            printf '%s' "${value:-$default}"
          }
          '''
          new = '''prompt_path() {
            local label="$1" default="$2" value
            if [ -r /dev/tty ]; then
              IFS= read -e -r -i "$default" -p "$label: " value < /dev/tty || true
            else
              value=""
            fi
            printf '%s' "${value:-$default}"
          }
          '''
          if old not in text:
              raise SystemExit('prompt_path pattern not found')
          text = text.replace(old, new, 1)
          text = text.replace('TLS_INPUT="$(prompt_path "$(msg cert_dir)" "$HOME")"', 'TLS_INPUT="$(prompt_path "$(msg cert_dir)" "$HOME/")"', 1)
          p.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/install.sh scripts/install-core.sh
          git commit -m "fix(installer): restore editable path completion"
          git push origin HEAD:main
