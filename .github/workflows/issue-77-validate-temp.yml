name: Issue 77 validation (temporary)

on:
  push:
    branches:
      - issue-77-instance-owner

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check issue 77 web files
        run: >-
          pnpm biome check
          apps/web/src/lib/instance-admin.ts
          apps/web/src/app/api/instance-admins/route.ts
          apps/web/src/app/api/instance-admins/remove/route.ts
          apps/web/src/app/api/instance-bootstrap/claim/route.ts
          apps/web/src/app/api/instance-bootstrap/status/route.ts
          apps/web/src/app/setup/setup-flow.tsx
          apps/web/src/app/signup/page.tsx
          apps/web/src/app/signup/use-signup-page.ts
          apps/web/e2e/instance-bootstrap.spec.mjs
      - run: pnpm --filter @mailflow/web typecheck
      - run: pnpm --filter @mailflow/web build
        env:
          WEB_AUTH: "off"

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm --prefix apps/web/e2e install --no-package-lock --ignore-scripts
      - name: Install Chromium
        working-directory: apps/web/e2e
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: apps/web/e2e
        run: npm test
