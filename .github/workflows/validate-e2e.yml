name: Targeted E2E Validation

on:
  push:
    branches:
      - feat/mvp-guidelines-figma-redesign
    paths:
      - .github/workflows/validate-e2e.yml

jobs:
  api-targeted:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mailflow
          POSTGRES_PASSWORD: mailflow
          POSTGRES_DB: mailflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: latest
          python-version: "3.13"
      - run: uv sync --all-packages
      - run: >-
          uv run ruff check
          apps/api/app/services/dashboard_search.py
          apps/api/app/services/dashboard_overview.py
          apps/api/app/services/user_preferences.py
          apps/api/tests/unit/test_user_preferences.py
      - name: Run focused API tests
        working-directory: apps/api
        env:
          SECRET_KEY: qdCa5nGhLjd8qY0CCaQP2dE000lbSYDmtPnhzAVeVgs=
        run: uv run pytest tests/unit/test_user_preferences.py tests/unit/test_dashboard.py -q

  web-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome check apps/web/src apps/web/e2e apps/web/package.json package.json
      - run: pnpm --filter @mailflow/web typecheck

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm --prefix apps/web/e2e install --no-package-lock --ignore-scripts
      - name: Install Chromium
        working-directory: apps/web/e2e
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: apps/web/e2e
        run: npm test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 3
