name: Mailbox connection validation (temporary)

on:
  push:
    branches: [test-mvp]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install ruff
      - run: ruff check apps/api/app/routers/accounts.py apps/api/app/services/mailbox_connection_test.py
      - run: python -m compileall -q apps/api/app
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec biome lint apps/web/src/app/onboarding/use-onboarding-page.ts apps/web/src/lib/mailbox-connection-api.ts apps/web/src/app/app/accounts/[id]/ConnectionSettingsCard.tsx apps/web/src/app/app/accounts/[id]/ActionPolicyCard.tsx
      - run: pnpm --filter @mailflow/web typecheck
