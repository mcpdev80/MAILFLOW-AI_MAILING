name: MVP final fix (temporary)

on:
  push:
    branches:
      - test-mvp
    paths:
      - .github/workflows/mvp-final-fix-temp.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-mvp
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pnpm install --frozen-lockfile
      - name: Apply final formatter and E2E mock fixes
        shell: bash
        run: |
          pnpm biome check --write \
            apps/web/src/middleware.ts \
            apps/web/src/lib/server-api.ts \
            'apps/web/src/app/api/mf/[...path]/route.ts' \
            apps/web/src/app/onboarding/onboarding-ui.tsx \
            apps/web/src/app/setup/setup-ui.tsx
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/e2e/onboarding-flow.spec.mjs')
          text = path.read_text()
          text = text.replace('if (path.endsWith("/organization/create")) {', 'if (path.includes("/organization/create")) {')
          path.write_text(text)
          PY
          pnpm biome check apps/web/e2e/onboarding-flow.spec.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/middleware.ts apps/web/src/lib/server-api.ts 'apps/web/src/app/api/mf/[...path]/route.ts' apps/web/src/app/onboarding/onboarding-ui.tsx apps/web/src/app/setup/setup-ui.tsx apps/web/e2e/onboarding-flow.spec.mjs
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "fix(mvp): satisfy final formatting and signup regression checks"
            git push origin HEAD:test-mvp
          fi
