name: Validate Issue 7 Localization
on:
  push:
    branches:
      - feat/7-localization
    paths:
      - .github/workflows/validate-7.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: test-only-secret-key
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mailflow
          POSTGRES_PASSWORD: mailflow
          POSTGRES_DB: mailflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailflow -d mailflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: latest
          python-version: '3.13'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: uv sync --all-packages
      - run: pnpm install --frozen-lockfile
      - name: Validate backend delta
        run: |
          uv run ruff format --check apps/api/alembic/versions/023_user_preferences.py apps/api/app/models/user_preference.py apps/api/app/user_preferences_schemas.py apps/api/app/services/user_preferences.py apps/api/app/routers/user_preferences.py apps/api/app/models/__init__.py apps/api/app/routers/__init__.py apps/api/app/main.py apps/api/app/restore_validation.py apps/api/tests/unit/test_user_preferences.py
          uv run ruff check apps/api/alembic/versions/023_user_preferences.py apps/api/app/models/user_preference.py apps/api/app/user_preferences_schemas.py apps/api/app/services/user_preferences.py apps/api/app/routers/user_preferences.py apps/api/app/models/__init__.py apps/api/app/routers/__init__.py apps/api/app/main.py apps/api/app/restore_validation.py apps/api/tests/unit/test_user_preferences.py
          cd apps/api
          uv run pytest tests/unit/test_user_preferences.py
      - name: Validate web
        run: |
          pnpm biome check apps/web/src/lib/i18n.tsx apps/web/src/components/language-switcher.tsx apps/web/src/components/global-nav.tsx apps/web/src/app/layout.tsx apps/web/src/app/app/layout.tsx apps/web/src/app/onboarding/page.tsx apps/web/src/app/app/settings/preferences/page.tsx apps/web/src/lib/api.ts apps/web/src/lib/types.ts
          pnpm typecheck
