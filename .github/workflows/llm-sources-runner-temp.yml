name: LLM sources redesign runner (temporary)

on:
  push:
    branches:
      - test-mvp
    paths:
      - .github/llm-sources-redesign.trigger

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-mvp
          fetch-depth: 0
      - name: Apply redesign patch from staged workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          text = Path('.github/workflows/llm-sources-redesign-temp.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          code = dedent(text[start:end])
          code = code.replace('marker = "\\n};\\n" if lang == "de" else "\\n} as const;\\n"', 'marker = "\\n};\\n" if lang in {"de", "es"} else "\\n} as const;\\n"')
          exec(compile(code, 'llm-redesign-patch', 'exec'))
          PY
      - name: Fix generated source routing and accessibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          controller = Path("apps/web/src/app/app/settings/models/use-model-settings.ts")
          text = controller.read_text()
          text = text.replace(
              'setModels((current) => { const next = { ...current }; delete next.draft; return next; });',
              'setModels(({ draft: _draft, ...current }) => current);',
          )
          controller.write_text(text)

          ui = Path("apps/web/src/app/app/settings/models/model-settings-ui.tsx")
          text = ui.read_text()
          text = text.replace('<RoleRow role="fast"', '<RoleRow modelRole="fast"')
          text = text.replace('<RoleRow role="deep"', '<RoleRow modelRole="deep"')
          text = text.replace('<RoleRow role="generation"', '<RoleRow modelRole="generation"')
          text = text.replace(
              'function RoleRow({ role, title, controller }: { role: LLMRole; title: string; controller: ModelSettingsController }) {',
              'function RoleRow({ modelRole, title, controller }: { modelRole: LLMRole; title: string; controller: ModelSettingsController }) {',
          )
          text = text.replace('const value = controller.roles[role];', 'const value = controller.roles[modelRole];')
          text = text.replace('role === "generation"', 'modelRole === "generation"')
          text = text.replace('role === "deep"', 'modelRole === "deep"')
          text = text.replace('role === "fast"', 'modelRole === "fast"')
          text = text.replace('controller.setRoleProvider(role, e.target.value)', 'controller.setRoleProvider(modelRole, e.target.value)')
          text = text.replace('controller.setRoleModel(role, e.target.value)', 'controller.setRoleModel(modelRole, e.target.value)')
          text = text.replace('<label className="field"><span>{t("models.model")}</span>{draftModels.length ?', '<div className="field"><span>{t("models.model")}</span>{draftModels.length ?')
          text = text.replace('placeholder={t("models.manualModel")} />}</label>\n      <button className="btn secondary"', 'placeholder={t("models.manualModel")} />}</div>\n      <button className="btn secondary"', 1)
          marker = '<label className="field"><span>{t("models.model")}</span>{options.length ?'
          if marker in text:
              text = text.replace(marker, '<div className="field"><span>{t("models.model")}</span>{options.length ?', 1)
              tail = 'placeholder={t("models.manualModel")} />}</label></div></div>;'
              text = text.replace(tail, 'placeholder={t("models.manualModel")} />}</div></div></div>;', 1)
          ui.write_text(text)

          account = Path("apps/api/app/repositories/account.py")
          text = account.read_text()
          old = '''        def model_for(role: str, provider: LLMProvider | None) -> str | None:\n            item = assignments.get(role)\n            if item is not None and item.model_id:\n                return str(item.model_id)\n            if provider is None:\n                return None\n            if role == "generation":\n                return provider.generation_model or provider.default_generation_model\n            if role == "deep":\n                return provider.deep_classification_model or provider.default_classification_model\n            return provider.fast_classification_model or provider.default_classification_model\n'''
          new = '''        def model_for(role: str, provider: LLMProvider | None) -> str | None:\n            item = assignments.get(role)\n            if item is not None and item.model_id:\n                model_id = str(item.model_id)\n            elif provider is None:\n                return None\n            elif role == "generation":\n                model_id = provider.generation_model or provider.default_generation_model\n            elif role == "deep":\n                model_id = provider.deep_classification_model or provider.default_classification_model\n            else:\n                model_id = provider.fast_classification_model or provider.default_classification_model\n            if provider is None or "/" in model_id:\n                return model_id\n            prefix = {\n                "anthropic": "anthropic",\n                "gemini": "gemini",\n                "openrouter": "openrouter",\n                "ollama": "ollama",\n            }.get(provider.type.lower())\n            return f"{prefix}/{model_id}" if prefix else model_id\n'''
          if old not in text:
              raise SystemExit("account model_for anchor missing")
          account.write_text(text.replace(old, new, 1))
          PY
      - name: Python compile
        run: python -m compileall -q apps/api/app apps/api/alembic/versions/028_llm_role_assignments.py
      - uses: astral-sh/setup-uv@v4
        with:
          version: latest
          python-version: "3.13"
      - run: uv sync --all-packages
      - run: uv run ruff format apps/api/app/llm_schemas.py apps/api/app/routers/llm_providers.py apps/api/app/repositories/account.py apps/api/alembic/versions/028_llm_role_assignments.py
      - run: uv run ruff check apps/api/app/llm_schemas.py apps/api/app/routers/llm_providers.py apps/api/app/repositories/account.py apps/api/alembic/versions/028_llm_role_assignments.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm biome check --write apps/web/src/app/app/settings/models apps/web/src/lib/api.ts apps/web/src/lib/types.ts apps/web/src/lib/locales/*-model-settings.ts
      - run: pnpm typecheck
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api apps/web
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(llm): add multi-source provider management and role routing"
          git push origin HEAD:test-mvp
