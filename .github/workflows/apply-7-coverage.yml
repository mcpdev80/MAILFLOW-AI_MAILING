name: Apply Issue 7 Core UI Translation Coverage
on:
  push:
    branches:
      - feat/7-localization
    paths:
      - .github/workflows/apply-7-coverage.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/7-localization
      - name: Apply translation coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'anchor missing in {path}: {old[:70]!r}')
              p.write_text(text.replace(old, new, 1))

