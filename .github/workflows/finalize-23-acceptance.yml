name: Finalize Issue 23 Acceptance
on:
  push:
    branches:
      - feat/23-dashboard-search
    paths:
      - .github/workflows/finalize-23-acceptance.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mailflow
          POSTGRES_PASSWORD: mailflow
          POSTGRES_DB: mailflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailflow -d mailflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/23-dashboard-search
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
        with:
          version: latest
          python-version: '3.13'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Complete acceptance details
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Add exact-tag coverage to backend test helper and filter test.
          path = Path('apps/api/tests/unit/test_dashboard.py')
          text = path.read_text()
          if 'system_tags: list[str] | None = None,' not in text:
              text = text.replace(
                  '    decision_memory: bool = False,\n    processed_at: datetime | None = None,\n',
                  '    decision_memory: bool = False,\n    system_tags: list[str] | None = None,\n    user_tags: list[str] | None = None,\n    processed_at: datetime | None = None,\n',
                  1,
              )
              text = text.replace(
                  '        action_required=action_required,\n        confidence=0.95,\n',
                  '        action_required=action_required,\n        system_tags=system_tags or [],\n        user_tags=user_tags or [],\n        confidence=0.95,\n',
                  1,
              )
          if 'tag="invoice"' not in text:
              text = text.replace(
                  '        decision_memory=True,\n    )\n',
                  '        decision_memory=True,\n        system_tags=["invoice", "customer"],\n    )\n',
                  1,
              )
              anchor = '''    assert result.items[0].classification_source == "decision_memory"\n\n    hidden = await search_messages(session, identity, query="foreign private")'''
              replacement = '''    assert result.items[0].classification_source == "decision_memory"\n\n    tagged = await search_messages(session, identity, tag="invoice")\n    assert tagged.total == 1\n    assert tagged.items[0].subject == "Invoice September"\n\n    missing_tag = await search_messages(session, identity, tag="voice")\n    assert missing_tag.total == 0\n\n    hidden = await search_messages(session, identity, query="foreign private")'''
              if anchor not in text:
                  raise SystemExit('tag test anchor missing')
              text = text.replace(anchor, replacement, 1)
          path.write_text(text)

          # Search UI: actual authorized mailbox select + missing filters.
          path = Path('apps/web/src/app/app/search/page.tsx')
          text = path.read_text()
          if 'import { api } from "@/lib/api";' not in text:
              text = text.replace(
                  'import { type MessageSearchResult, dashboardApi } from "@/lib/dashboard-api";\n',
                  'import { api } from "@/lib/api";\nimport { type MessageSearchResult, dashboardApi } from "@/lib/dashboard-api";\nimport type { EmailAccount } from "@/lib/types";\n',
                  1,
              )
          if 'const [accounts, setAccounts]' not in text:
              text = text.replace(
                  '  const [result, setResult] = useState<MessageSearchResult | null>(null);\n',
                  '  const [accounts, setAccounts] = useState<EmailAccount[]>([]);\n  const [result, setResult] = useState<MessageSearchResult | null>(null);\n',
                  1,
              )
              effect_anchor = '''  const initialSearchDone = useRef(false);\n\n  useEffect(() => {'''
              effect_new = '''  const initialSearchDone = useRef(false);\n\n  useEffect(() => {\n    api.listAccounts().then(setAccounts).catch(() => setAccounts([]));\n  }, []);\n\n  useEffect(() => {'''
              if effect_anchor not in text:
                  raise SystemExit('account effect anchor missing')
              text = text.replace(effect_anchor, effect_new, 1)
          if '<span>Mailbox</span>' not in text:
              anchor = '''          <label className="field">\n            <span>Sender</span>\n            <input\n              value={filters.sender}\n              onChange={(event) => setFilter("sender", event.target.value)}\n            />\n          </label>\n'''
              addition = anchor + '''          <label className="field">\n            <span>Mailbox</span>\n            <select\n              value={filters.account_id}\n              onChange={(event) => setFilter("account_id", event.target.value)}\n            >\n              <option value="">All</option>\n              {accounts.map((account) => (\n                <option key={account.id} value={account.id}>\n                  {account.username}\n                </option>\n              ))}\n            </select>\n          </label>\n'''
              if anchor not in text:
                  raise SystemExit('mailbox UI anchor missing')
              text = text.replace(anchor, addition, 1)
          if '<span>Subcategory</span>' not in text:
              anchor = '''          <label className="field">\n            <span>{t("review.importance")}</span>'''
              addition = '''          <label className="field">\n            <span>Subcategory</span>\n            <input\n              value={filters.subcategory}\n              onChange={(event) => setFilter("subcategory", event.target.value)}\n            />\n          </label>\n''' + anchor
              if anchor not in text:
                  raise SystemExit('subcategory UI anchor missing')
              text = text.replace(anchor, addition, 1)
          if '<span>Processing state</span>' not in text:
              anchor = '''          <label className="field">\n            <span>Classification source</span>'''
              addition = '''          <label className="field">\n            <span>Processing state</span>\n            <select\n              value={filters.processed_state}\n              onChange={(event) => setFilter("processed_state", event.target.value)}\n            >\n              <option value="">All</option>\n              <option value="execute">Executed</option>\n              <option value="review">Review</option>\n              <option value="pending">Pending</option>\n              <option value="queued">Queued</option>\n              <option value="deferred">Deferred</option>\n              <option value="blocked">Blocked</option>\n              <option value="failed">Failed</option>\n              <option value="error">Error</option>\n            </select>\n          </label>\n''' + anchor
              if anchor not in text:
                  raise SystemExit('processed state UI anchor missing')
              text = text.replace(anchor, addition, 1)
          path.write_text(text)

          # Dashboard: expose totals, automation and inference health explicitly.
          path = Path('apps/web/src/app/app/dashboard/page.tsx')
          text = path.read_text()
          if 'label="Total processed"' not in text:
              anchor = '''            <MetricCard\n              label="Processed today"\n              value={overview.counters.processed_today}\n            />\n'''
              addition = '''            <MetricCard\n              label="Total processed"\n              value={overview.counters.total_processed}\n            />\n''' + anchor
              if anchor not in text:
                  raise SystemExit('total metric anchor missing')
              text = text.replace(anchor, addition, 1)
          if 'label="Automated actions"' not in text:
              anchor = '''            <MetricCard\n              label="Active backfills"\n              value={overview.counters.active_backfills}\n            />\n'''
              addition = '''            <MetricCard\n              label="Automated actions"\n              value={overview.counters.automated_actions}\n            />\n            <MetricCard\n              label={`Inference: ${overview.inference_status}`}\n              value={overview.counters.fast_model + overview.counters.deep_model + overview.counters.decision_memory}\n            />\n''' + anchor
              if anchor not in text:
                  raise SystemExit('automation metric anchor missing')
              text = text.replace(anchor, addition, 1)
          path.write_text(text)
          PY
      - run: uv sync --all-packages
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Backend validation
        shell: bash
        run: |
          uv run ruff format apps/api/tests/unit/test_dashboard.py
          uv run ruff check apps/api/app/services/dashboard.py apps/api/tests/unit/test_dashboard.py
          cd apps/api
          SECRET_KEY=issue23-acceptance-test-key-000000000000000000 REDIS_URL=redis://127.0.0.1:6399/0 uv run pytest tests/unit/test_dashboard.py -q
      - name: Web validation
        shell: bash
        run: |
          base=$(git merge-base HEAD origin/main)
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base"...HEAD | grep -E '^apps/web/.*\.(js|jsx|ts|tsx|json|jsonc)$' || true)
          if (( ${#files[@]} )); then
            pnpm biome check --write "${files[@]}"
          fi
          pnpm typecheck
      - name: Commit validated acceptance changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/tests apps/web
          git diff --cached --check
          git commit -m 'feat(dashboard): complete search filters and operational metrics'
          git push origin HEAD:feat/23-dashboard-search
