name: Apply final MVP fixes (temporary)

on:
  push:
    branches:
      - feat/mvp-guidelines-figma-redesign
    paths:
      - .github/workflows/apply-final-mvp-fixes-temp.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mvp-guidelines-figma-redesign
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pnpm install --frozen-lockfile
      - name: Apply final fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changes = {
              "apps/web/src/app/app/review/use-review-page.ts": [
                  ('item.job_id!,', 'jobId,'),
                  ('    (item: OperationalReviewItem) => {\n      if (item.source_type !== "backfill_failure" || !item.job_id) {', '    (item: OperationalReviewItem) => {\n      const jobId = item.job_id;\n      if (item.source_type !== "backfill_failure" || !jobId) {'),
              ],
              "apps/web/src/app/app/dashboard/dashboard-ui.tsx": [
                  ('      >\n        <polyline\n          className={styles.trendLine}', '      >\n        <title>{props.t("dashboard.trend")}</title>\n        <polyline\n          className={styles.trendLine}'),
              ],
              "apps/web/src/app/app/dashboard/page.tsx": [
                  ('function DashboardContent({ state }: { state: DashboardState }) {\n  const overview = state.overview!;\n  return (', 'function DashboardContent({ state }: { state: DashboardState }) {\n  if (!state.overview) return null;\n  return ('),
                  ('function DashboardGrid({ state }: { state: DashboardState }) {\n  const { t } = useI18n();\n  const overview = state.overview!;\n  return (', 'function DashboardGrid({ state }: { state: DashboardState }) {\n  const { t } = useI18n();\n  const overview = state.overview;\n  if (!overview) return null;\n  return ('),
              ],
              "apps/web/src/app/app/mail/mail-workspace-overlays.tsx": [
                  ('  const menu = state.contextMenu!;\n  return (', '  const menu = state.contextMenu;\n  if (!menu) return null;\n  return ('),
                  ('  const result = state.aiResult!;\n  return (', '  const result = state.aiResult;\n  if (!result) return null;\n  return ('),
              ],
              "apps/web/src/app/app/mail/mail-workspace-content.tsx": [
                  ('  const selected = state.selected!;\n  return (', '  const selected = state.selected;\n  if (!selected) return null;\n  return ('),
                  ('function MoreButton({ state }: { state: WorkspaceState }) {\n  const { t } = useI18n();\n  return (', 'function MoreButton({ state }: { state: WorkspaceState }) {\n  const { t } = useI18n();\n  const selected = state.selected;\n  if (!selected) return null;\n  return ('),
                  ('state.openContextMenuAt(state.selected!, {', 'state.openContextMenuAt(selected, {'),
              ],
              "apps/web/src/app/app/attachments/attachments-ui.tsx": [
                  ('<div className={styles.toast} role="status">\n          {t("attachments.decisionSaved")}\n        </div>', '<output className={styles.toast}>\n          {t("attachments.decisionSaved")}\n        </output>'),
              ],
              "apps/web/src/app/app/compose/compose-ui.tsx": [
                  ('    <label\n      style={{', '    <div\n      style={{'),
                  ('    </label>\n  );\n}\n\nfunction AiBar', '    </div>\n  );\n}\n\nfunction AiBar'),
                  ('      <EditorMode\n        value={controller.fields.editorMode}', '      <EditorModeToggle\n        value={controller.fields.editorMode}'),
                  ('function EditorMode({', 'function EditorModeToggle({'),
              ],
              "apps/web/src/app/app/mail/use-mail-message-view.ts": [
                  ('  useEffect(() => {\n    setSelected(null);\n    setThread(null);\n  }, [options.selectedAccountId]);', '  // biome-ignore lint/correctness/useExhaustiveDependencies: changing mailboxes must clear the selected message.\n  useEffect(() => {\n    setSelected(null);\n    setThread(null);\n  }, [options.selectedAccountId]);'),
              ],
              "apps/web/src/app/app/learning/page.tsx": [
                  ('      <section\n        className={page.modal}\n        role="dialog"\n        aria-modal="true"\n        aria-labelledby="create-memory-title"\n      >', '      <dialog open className={page.modal} aria-labelledby="create-memory-title">'),
                  ('      </section>\n    </div>\n  );\n}\n\nfunction toWrite', '      </dialog>\n    </div>\n  );\n}\n\nfunction toWrite'),
              ],
          }

          for path, replacements in changes.items():
              p = Path(path)
              text = p.read_text()
              for old, new in replacements:
                  if old in text:
                      text = text.replace(old, new, 1)
              p.write_text(text)
          PY

          files=(
            apps/web/src/app/app/review/use-review-page.ts
            apps/web/src/app/app/dashboard/dashboard-ui.tsx
            apps/web/src/app/app/dashboard/page.tsx
            apps/web/src/app/app/compose/compose-ui.tsx
            apps/web/src/app/app/mail/mail-workspace-overlays.tsx
            apps/web/src/app/app/mail/mail-workspace-content.tsx
            apps/web/src/app/app/mail/use-mail-message-view.ts
            apps/web/src/app/app/attachments/attachments-ui.tsx
            apps/web/src/app/app/learning/page.tsx
          )
          pnpm biome format --write "${files[@]}"
          pnpm biome check "${files[@]}"

          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "fix(web): resolve final MVP lint diagnostics"
          git push origin HEAD:feat/mvp-guidelines-figma-redesign
