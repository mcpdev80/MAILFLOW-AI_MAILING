name: Format diff helper

on:
  push:
    branches: [ci-format-fix]

jobs:
  ruff-format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: "3.13"
      - run: uv sync --all-packages
      - name: Show Ruff formatter diff
        run: >-
          uv run ruff format --diff
          apps/api/alembic/versions/007_mailbox_ownership.py
          apps/api/app/mailbox_access.py
          apps/api/app/models/mailbox_access.py
          apps/api/app/routers/oauth.py
          apps/api/tests/unit/test_mailbox_ownership.py

# Temporary helper: remove after the formatter diff has been captured.
