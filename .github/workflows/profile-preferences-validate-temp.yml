name: Profile preferences validation (temporary)

on:
  push:
    branches:
      - test-mvp
    paths:
      - .github/workflows/profile-preferences-validate-temp.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mailflow
          POSTGRES_PASSWORD: mailflow
          POSTGRES_DB: mailflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-mvp
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: "3.13"
      - run: uv sync --all-packages
      - run: uv run ruff check apps/api/app/models/user_preference.py apps/api/app/user_preferences_schemas.py apps/api/app/services/user_preferences.py apps/api/alembic/versions/027_profile_locale_preferences.py apps/api/tests/unit/test_user_preferences.py
      - run: uv run ruff format --check apps/api/app/models/user_preference.py apps/api/app/user_preferences_schemas.py apps/api/app/services/user_preferences.py apps/api/alembic/versions/027_profile_locale_preferences.py apps/api/tests/unit/test_user_preferences.py
      - name: Run user preference tests
        working-directory: apps/api
        env:
          SECRET_KEY: qdCa5nGhLjd8qY0CCaQP2dE000lbSYDmtPnhzAVeVgs=
        run: uv run pytest tests/unit/test_user_preferences.py
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome check apps/web/src/lib/types.ts apps/web/src/components/settings-shell.tsx apps/web/src/app/app/settings/profile/page.tsx
      - run: pnpm typecheck
