name: Fix installer ref fetch (temporary)

on:
  push:
    branches:
      - test-mvp
    paths:
      - .github/workflows/fix-ref-fetch-temp.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-mvp
      - name: Fix branch fetch for existing checkouts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_all(path: str):
              p = Path(path)
              text = p.read_text()
              text = text.replace(
                  'git -C "$dir" fetch origin "$ref"\n',
                  'git -C "$dir" fetch origin "+refs/heads/$ref:refs/remotes/origin/$ref"\n'
              )
              text = text.replace(
                  'git -C "$INSTALL_DIR" fetch origin "$BRANCH"\n  git -C "$INSTALL_DIR" checkout "$BRANCH"\n  git -C "$INSTALL_DIR" pull --ff-only origin "$BRANCH"',
                  'git -C "$INSTALL_DIR" fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"\n  if git -C "$INSTALL_DIR" show-ref --verify --quiet "refs/heads/$BRANCH"; then\n    git -C "$INSTALL_DIR" checkout "$BRANCH"\n  else\n    git -C "$INSTALL_DIR" checkout -b "$BRANCH" --track "origin/$BRANCH"\n  fi\n  git -C "$INSTALL_DIR" pull --ff-only origin "$BRANCH"'
              )
              text = text.replace(
                  'git fetch origin "$BRANCH"\n  git checkout "$BRANCH"\n  git pull --ff-only origin "$BRANCH"',
                  'git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"\n  if git show-ref --verify --quiet "refs/heads/$BRANCH"; then\n    git checkout "$BRANCH"\n  else\n    git checkout -b "$BRANCH" --track "origin/$BRANCH"\n  fi\n  git pull --ff-only origin "$BRANCH"'
              )
              p.write_text(text)

          for path in ['scripts/install.sh', 'scripts/install-core.sh', 'scripts/resume.sh']:
              replace_all(path)
          PY

          bash -n scripts/install.sh
          bash -n scripts/install-core.sh
          bash -n scripts/resume.sh

          grep -q 'refs/remotes/origin/$ref' scripts/install.sh
          grep -q 'refs/remotes/origin/$BRANCH' scripts/install-core.sh

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/install.sh scripts/install-core.sh scripts/resume.sh
          git commit -m "fix(installer): fetch requested branch into remote tracking ref"
          git push origin HEAD:test-mvp
