name: Mailbox SMTP validation (temporary)

on:
  push:
    branches: [test-mvp]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec biome lint apps/web/src/app/onboarding/onboarding-ui.tsx apps/web/src/app/onboarding/use-onboarding-page.ts
      - run: pnpm --filter @mailflow/web typecheck
