name: Validate Issue 23 Web
on:
  push:
    branches:
      - feat/23-dashboard-search
    paths:
      - .github/workflows/validate-23-web.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/23-dashboard-search
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fix known lint findings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          dashboard = Path('apps/web/src/app/app/dashboard/page.tsx')
          text = dashboard.read_text()
          old = '''          const row = (\n            <div\n              style={{'''
          new = '''          const row = (\n            <div\n              key={item.key}\n              style={{'''
          if old in text:
              dashboard.write_text(text.replace(old, new, 1))
          elif 'key={item.key}' not in text:
              raise SystemExit('dashboard key anchor missing')

          search = Path('apps/web/src/app/app/search/page.tsx')
          text = search.read_text()
          if 'useRef' not in text:
              text = text.replace(
                  'import { useCallback, useEffect, useMemo, useState } from "react";',
                  'import { useCallback, useEffect, useMemo, useRef, useState } from "react";',
                  1,
              )
          old_effect = '''  useEffect(() => {\n    runSearch(filters);\n    // Run once for URL-provided drill-down filters.\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, []);'''
          new_effect = '''  const initialSearchDone = useRef(false);\n\n  useEffect(() => {\n    if (initialSearchDone.current) return;\n    initialSearchDone.current = true;\n    runSearch(filters);\n  }, [filters, runSearch]);'''
          if old_effect in text:
              text = text.replace(old_effect, new_effect, 1)
          elif 'initialSearchDone' not in text:
              raise SystemExit('search effect anchor missing')
          search.write_text(text)
          PY
      - name: Install without native postinstall builds
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format changed web files
        shell: bash
        run: |
          base=$(git merge-base HEAD origin/main)
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base"...HEAD | grep -E '^apps/web/.*\.(js|jsx|ts|tsx|json|jsonc)$' || true)
          if (( ${#files[@]} )); then
            pnpm biome check --write "${files[@]}"
          fi
      - name: Typecheck
        run: pnpm typecheck
      - name: Commit validated web changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix(dashboard): satisfy web lint and type checks'
            git push origin HEAD:feat/23-dashboard-search
          fi
