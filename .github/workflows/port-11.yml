name: Port Issue 11 UI Delta
on:
  push:
    branches:
      - feat/11-decision-memory-management
    paths:
      - .github/workflows/port-11.yml

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/11-decision-memory-management
          fetch-depth: 0
      - name: Apply old PR client delta onto current main
        shell: bash
        run: |
          git fetch origin c1722387bc206c13f6666a2418707523983b593d cec00f1ce984ab44ee214b0c40495335783441c7
          git diff cec00f1ce984ab44ee214b0c40495335783441c7 c1722387bc206c13f6666a2418707523983b593d -- apps/web/src/lib/api.ts apps/web/src/lib/types.ts > /tmp/decision-memory.patch
          git apply --3way /tmp/decision-memory.patch
          git diff --check
      - name: Commit port
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/lib/api.ts apps/web/src/lib/types.ts
          git commit -m 'feat(web): add DecisionMemory client contracts'
          git push origin HEAD:feat/11-decision-memory-management
