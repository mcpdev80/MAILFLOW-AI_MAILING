name: Validate Issue 11 UI
on:
  push:
    branches:
      - feat/11-decision-memory-management
    paths:
      - .github/workflows/port-11.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/11-decision-memory-management
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Add mailbox navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/app/app/accounts/[id]/page.tsx')
          text = path.read_text()
          if '/decision-memory' not in text:
              old = '''              {contentAccessible && (\n                <button\n                  type="button"\n                  className="btn"\n                  onClick={runNow}\n                  disabled={busy}\n                >\n                  {busy ? "Working…" : "Run cycle now"}\n                </button>\n              )}\n'''
              new = '''              {contentAccessible && (\n                <>\n                  <Link\n                    className="btn secondary"\n                    href={`/app/accounts/${id}/decision-memory`}\n                  >\n                    Learned decisions\n                  </Link>\n                  <button\n                    type="button"\n                    className="btn"\n                    onClick={runNow}\n                    disabled={busy}\n                  >\n                    {busy ? "Working…" : "Run cycle now"}\n                  </button>\n                </>\n              )}\n'''
              if text.count(old) != 1:
                  raise SystemExit('mailbox action anchor not unique')
              path.write_text(text.replace(old, new, 1))
          PY
      - run: pnpm install --frozen-lockfile
      - name: Format and lint changed web files
        shell: bash
        run: |
          pnpm biome check --write \
            'apps/web/src/app/app/accounts/[id]/decision-memory/page.tsx' \
            'apps/web/src/app/app/accounts/[id]/page.tsx' \
            apps/web/src/lib/api.ts \
            apps/web/src/lib/types.ts
          git diff --check
      - run: pnpm typecheck
      - name: Commit validated UI
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/app/app/accounts/[id]/decision-memory/page.tsx apps/web/src/app/app/accounts/[id]/page.tsx apps/web/src/lib/api.ts apps/web/src/lib/types.ts
          if ! git diff --cached --quiet; then
            git commit -m 'feat(web): link and validate DecisionMemory management'
            git push origin HEAD:feat/11-decision-memory-management
          fi
