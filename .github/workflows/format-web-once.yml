name: Format Changed Web Files Once

on:
  push:
    branches:
      - feat/mvp-guidelines-figma-redesign
    paths:
      - .github/workflows/format-web-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pnpm install --frozen-lockfile
      - name: Apply safe Biome fixes to changed web files
        shell: bash
        run: |
          base=$(git merge-base HEAD origin/main)
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base"...HEAD | grep -E '^(apps/web/.*\.(js|jsx|mjs|cjs|ts|tsx|mts|cts|json|jsonc)|apps/web/package\.json|package\.json)$' || true)
          if (( ${#files[@]} == 0 )); then
            echo "No changed web files."
            exit 0
          fi
          pnpm biome format --write "${files[@]}"
          pnpm biome check --write "${files[@]}" || true
      - name: Commit formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web package.json
          git commit -m "style: format changed web files"
          git push origin HEAD:feat/mvp-guidelines-figma-redesign
