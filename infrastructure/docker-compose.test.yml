services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: mailflow
      POSTGRES_PASSWORD: mailflow
      POSTGRES_DB: mailflow_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailflow -d mailflow_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  test:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.test
    working_dir: /workspace
    environment:
      SECRET_KEY: qdCa5nGhLjd8qY0CCaQP2dE000lbSYDmtPnhzAVeVgs=
      TEST_DATABASE_URL: postgresql+asyncpg://mailflow:mailflow@postgres:5432/mailflow_test
    depends_on:
      postgres:
        condition: service_healthy

  format:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.test
    working_dir: /workspace
    volumes:
      - ../:/workspace
    command: ["bash", "scripts/format.sh"]
