# MailFlow production self-host stack.
# Only the edge proxy publishes host ports. Web/API/data services stay on Docker networks.

services:
  edge:
    image: caddy:2-alpine
    environment:
      MAILFLOW_DOMAIN: ${MAILFLOW_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
    networks:
      - edge
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mailflow}
      POSTGRES_USER: ${POSTGRES_USER:-mailflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mailflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mailflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mailflow}:${POSTGRES_PASSWORD:-mailflow}@postgres:5432/${POSTGRES_DB:-mailflow}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required - see README}
      AUTH_MODE: ${AUTH_MODE:-single}
      SINGLE_TENANT_API_KEY: ${SINGLE_TENANT_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
      - data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mailflow}:${POSTGRES_PASSWORD:-mailflow}@postgres:5432/${POSTGRES_DB:-mailflow}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required - see README}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - backend
      - data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.web
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
      WEB_AUTH: ${WEB_AUTH:-off}
      SINGLE_TENANT_API_KEY: ${SINGLE_TENANT_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://mailflow:mailflow@postgres:5432/mailflow}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://${MAILFLOW_DOMAIN:-localhost}}
      WEB_SECRET_KEY: ${WEB_SECRET_KEY:-}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
      - data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  web-migrate:
    profiles: ["migrate"]
    image: pgvector/pgvector:pg17
    entrypoint:
      - sh
      - -c
      - psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f /schema/better-auth-schema.sql
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mailflow}:${POSTGRES_PASSWORD:-mailflow}@postgres:5432/${POSTGRES_DB:-mailflow}
    volumes:
      - ../apps/web/better-auth-schema.sql:/schema/better-auth-schema.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    restart: "no"
    security_opt:
      - no-new-privileges:true

networks:
  edge:
  backend:
  data:
    internal: true

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
