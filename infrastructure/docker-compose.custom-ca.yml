services:
  api:
    environment:
      SSL_CERT_FILE: /etc/mailflow/ca/custom-ca.pem
      REQUESTS_CA_BUNDLE: /etc/mailflow/ca/custom-ca.pem
    volumes:
      - ${MAILFLOW_CA_BUNDLE:?MAILFLOW_CA_BUNDLE is required}:/etc/mailflow/ca/custom-ca.pem:ro

  worker:
    environment:
      SSL_CERT_FILE: /etc/mailflow/ca/custom-ca.pem
      REQUESTS_CA_BUNDLE: /etc/mailflow/ca/custom-ca.pem
    volumes:
      - ${MAILFLOW_CA_BUNDLE:?MAILFLOW_CA_BUNDLE is required}:/etc/mailflow/ca/custom-ca.pem:ro

  web:
    environment:
      NODE_EXTRA_CA_CERTS: /etc/mailflow/ca/custom-ca.pem
    volumes:
      - ${MAILFLOW_CA_BUNDLE:?MAILFLOW_CA_BUNDLE is required}:/etc/mailflow/ca/custom-ca.pem:ro
