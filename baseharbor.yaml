version: 1

app:
  name: mailflow
  environment: dev

services:
  postgres:
    enabled: true
  redis:
    enabled: true
  secrets:
    enabled: true

secrets:
  required:
    - name: SECRET_KEY
      generate:
        type: hex
        bytes: 32
    - name: BETTER_AUTH_SECRET
      generate:
        type: hex
        bytes: 32
    - name: WEB_SECRET_KEY
      generate:
        type: hex
        bytes: 32
    - name: INTERNAL_API_SECRET
      generate:
        type: hex
        bytes: 32
    - name: SINGLE_TENANT_API_KEY
      generate:
        type: hex
        bytes: 32
